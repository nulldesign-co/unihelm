[workspace]
resolver = "3"
members = [
    "crates/unihelm-core",
    "crates/unihelm-config",
    "crates/unihelm-db",
    "crates/unihelm-ipc",
    "crates/unihelm-distro",
    "crates/unihelm-ops",
    "crates/unihelm-metrics",
    "crates/unihelm-web",
    "crates/unihelm-agentd",
    "crates/unihelm-cli",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
# Raised from 1.85 when `zip` 8 arrived with the file manager: it declares
# rust-version 1.88, and a workspace claiming less than its dependencies is a
# claim that fails on the first machine that believes it. Spec §4.1 puts the
# floor at latest-stable-minus-two, which is well above this.
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["farzam"]
repository = "https://github.com/farzam-seyedhashem/unihelm"

[workspace.dependencies]
unihelm-config = { path = "crates/unihelm-config" }
unihelm-core = { path = "crates/unihelm-core" }
unihelm-db = { path = "crates/unihelm-db" }
unihelm-ipc = { path = "crates/unihelm-ipc" }
unihelm-distro = { path = "crates/unihelm-distro" }
unihelm-ops = { path = "crates/unihelm-ops" }
unihelm-metrics = { path = "crates/unihelm-metrics" }

anyhow = "1"
base64 = "0.22.1"
# minisign verification for plugin payloads (spec §6 plugin note): the same
# ed25519/minisign format the installer and self-update already trust, verified
# in-process rather than by shelling out to a binary that may not be installed.
blake2 = "0.10.6"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize"] }
# File-manager content crosses the op JSON as base64 chunks (spec §11.7).
# Archive formats for fs.compress / fs.extract (spec §11.7). Extraction is
# zip-bomb and path-traversal guarded in unihelm-ops::fsops::archive.
# zip is default-features = false: the defaults pull AES, bzip2, lzma, ppmd and
# xz — attack surface and binary size for formats the file manager never emits.
flate2 = "1.1.9"
tar = "0.4.46"
thiserror = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
zstd = "0.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5.3.1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json", "time", "uuid"] }
clap = { version = "4", features = ["derive", "env"] }
# Shell completions for `unihelm completions <shell>` (spec §11.20). Generated
# from the same clap tree the binary parses with, so they cannot drift.
clap_complete = "4"
async-trait = "0.1"
futures = "0.3"
libc = "0.2"
toml = "0.8"
rand = "0.8"
hex = "0.4"
# HMAC-SHA256 over webhook bodies (spec §14 Phase 6): the signature a receiver
# verifies. `hmac` 0.12 shares the digest 0.10 traits with sha2 above.
hmac = "0.12"
sha2 = "0.10"
# sha512-crypt for /etc/shadow: sshd/PAM verify tenant SFTP passwords through
# crypt(3), which cannot read the panel's argon2 hashes (see ops::sftp).
sha-crypt = "0.6.0"

# DNS resolution the panel does itself (spec §11.13, §11.5): the `dns.check`
# advisory, and DNS-01 propagation polling against a zone's *authoritative*
# nameservers. A stub resolver is not enough for the second job — asking the
# local recursor whether a TXT record exists gets its cache, which is precisely
# the stale answer that makes an ACME order fail after the record is live.
hickory-resolver = "0.26.1"
# The Cloudflare API client (spec §11.13) and repository signing-key fetches.
# rustls rather than OpenSSL, so a release build needs no system TLS library and
# `cargo deny` can keep banning openssl-sys.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2", "charset", "json"] }
# The SMTP submission client (spec §11.18). rustls again, over the same
# aws-lc-rs provider ACME already links, so no second crypto backend and no
# system TLS library. `webpki-roots` rather than the platform store: the
# relay's certificate is checked against a compiled-in copy of Mozilla's roots,
# which is deterministic across the two distro families the panel supports.
tokio-rustls = "0.26.4"
webpki-roots = "1.0.9"

# CI-enforced budgets (spec §3) depend on a small, stripped binary.
# NOTE: panic stays `unwind` on purpose — unihelm-web wraps handlers in
# CatchPanicLayer so one bad request cannot take the panel down.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1
