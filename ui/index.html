<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Unihelm</title>
    <!--
      Set the theme before first paint. Doing this in React would mean a flash of
      the wrong colours on every load, which is the kind of small ugliness that
      makes software feel cheap.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("unihelm.theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          var lang = localStorage.getItem("unihelm.lang") || "en";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
