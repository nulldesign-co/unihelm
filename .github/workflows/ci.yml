name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures: the budgets and invariants only mean something if the
  # build refuses to look away from them (spec §16.3).
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      # Migrations are forward-only and checked in CI (spec §4.1): a changed
      # checksum on an applied migration means somebody edited history.
      - name: Migrations apply to a fresh database
        run: cargo test -p ferrum-db migrations

  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      # Full history, not a shallow clone: tests/gates/migrations.sh compares
      # each migration against the blob at its *first* commit, and a shallow
      # checkout cannot answer that. It fails loudly rather than passing
      # blindly, so this is load-bearing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The invariant that kills shell injection as a category (spec §12 rule 2).
      - name: No shell string execution
        run: bash tests/gates/no-shell.sh

      # A gate nobody ever saw fail might be matching nothing at all.
      - name: No-shell gate self-test
        run: bash tests/gates/no-shell.sh --self-test

      - name: Migrations are numbered once and never rewritten
        run: bash tests/gates/migrations.sh

      - name: Migration gate self-test
        run: bash tests/gates/migrations.sh --self-test

      # Every registered operation appears in docs/ (spec §16.5, §16.10).
      - name: Registered operations are documented
        run: bash tests/gates/ops-docs.sh

      # Fixture builds, no npm: this checks the UI budget's own logic. The real
      # measurement happens in the `ui` job, which has a build to measure.
      - name: Budget gate self-test
        run: bash tests/gates/budgets.sh --self-test

      # The installer downloads a signed binary by default (spec §5.5), so the
      # gate drives the real signature and checksum code against local fixtures
      # — and must also still prove the older lesson, that a preflight check
      # cannot kill the script silently on a clean server. minisign is installed
      # rather than stubbed: the gate falls back to a test double when it is
      # absent, and the point of running it in CI is that at least one place
      # checks a genuine ed25519 signature.
      - name: Installer gate
        run: |
          sudo apt-get update -qq && sudo apt-get install -y minisign
          bash tests/gates/installer.sh

      # The release workflow cannot be exercised without a tag and a signing
      # key, so the steps it cannot be correct without are asserted here instead
      # — including that the signing key never reaches a log or the workspace.
      - name: Release pipeline still signs, budgets and drafts
        run: bash tests/gates/release.sh

      - name: Shellcheck
        run: |
          command -v shellcheck >/dev/null ||
            { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          # -x follows `# shellcheck source=` directives so install.sh is checked
          # together with the preflight it sources; --source-path=SCRIPTDIR makes
          # those resolve relative to the script rather than the working
          # directory, without which every sourcing script reports an
          # unfollowable SC1091 and shellcheck exits non-zero on an
          # informational finding.
          shellcheck -x --source-path=SCRIPTDIR installer/*.sh tests/gates/*.sh

  supply-chain:
    name: Supply chain (advisory)
    runs-on: ubuntu-latest
    # Non-blocking on purpose. cargo-deny's advisory database is updated
    # continuously, so an unrelated CVE published this morning would turn every
    # pull request red without a line of our code changing. The signal is worth
    # having; the veto is not. Bans, licences and duplicate versions are the
    # parts under our control — promote this to blocking once the advisory half
    # is split out or pinned.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Advisories, licences, bans and duplicate versions (spec §12 rule 9),
      # configured by deny.toml at the repository root.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  ui:
    name: UI — typecheck, build, bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The build output itself, keyed on everything that can change it: the
      # lockfile, the sources, the entry HTML and the build configuration.
      # A hit skips npm entirely — and skipping the typecheck with it is sound
      # precisely because the key covers every input the typecheck reads.
      - name: Cache the UI build
        id: ui-build-cache
        uses: actions/cache@v4
        with:
          path: crates/ferrum-web/ui-dist
          key: ui-dist-${{ runner.os }}-node22-${{ hashFiles('ui/package-lock.json', 'ui/index.html', 'ui/vite.config.ts', 'ui/tsconfig*.json', 'ui/src/**') }}

      - run: npm ci
        if: steps.ui-build-cache.outputs.cache-hit != 'true'
        working-directory: ui

      - name: Typecheck
        if: steps.ui-build-cache.outputs.cache-hit != 'true'
        run: npm run typecheck
        working-directory: ui

      - name: Build
        if: steps.ui-build-cache.outputs.cache-hit != 'true'
        run: npm run build
        working-directory: ui

      # Measured every run, cache hit or not: the budget is about the artefact,
      # and a restored artefact is the same artefact.
      - name: Bundle budget (largest initial chunk ≤ 350 KB gzipped)
        run: bash tests/gates/budgets.sh bundle

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/ferrum-web/ui-dist
          retention-days: 3

  budgets:
    name: Budgets — binary size and idle memory
    runs-on: ubuntu-latest
    needs: ui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The real UI, so the binary size measured is the binary shipped.
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/ferrum-web/ui-dist

      - name: Release build
        run: cargo build --release

      - name: Binary size (≤ 25 MB each)
        run: bash tests/gates/budgets.sh binaries

      - name: Idle RSS (≤ 80 MB, web + agent combined)
        run: bash tests/gates/budgets.sh rss

  distros:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both families, both currently-supported majors (spec §7.1). Adding a
        # distribution should mean adding a line here and nothing else.
        image:
          - debian:13
          - debian:12
          - ubuntu:24.04
          - almalinux:10
          - almalinux:9
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install build prerequisites
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends curl ca-certificates build-essential pkg-config
          else
            dnf install -y --setopt=install_weak_deps=False curl ca-certificates gcc make
          fi

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --workspace

      # Detection and the distro abstraction are the parts that differ per
      # image; this proves the right backends are picked before anything else
      # gets built on top of them (spec §7.2).
      - name: Distro detection and backend selection
        run: cargo test -p ferrum-distro

      - name: Agent starts and validates its configuration
        run: |
          mkdir -p /tmp/fd
          ./target/debug/ferrum-agentd --dev /tmp/fd --check
