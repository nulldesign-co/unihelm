[package]
name = "ferrum-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ferrum"
path = "src/main.rs"

[dependencies]
ferrum-core = { workspace = true }
ferrum-db = { workspace = true }
ferrum-distro = { workspace = true }
ferrum-ipc = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Tests only, and deliberately: `parity.rs` deserialises every payload the CLI
# would send into the operation's *own* `Input` type, which is the only way to
# prove `ferrum site create` sends what `site.create` parses without a running
# agent. It is a dev-dependency, so none of this reaches the binary — and CI
# already builds ferrum-ops for the workspace, so it costs nothing there.
ferrum-ops = { workspace = true }
serde = { workspace = true }
