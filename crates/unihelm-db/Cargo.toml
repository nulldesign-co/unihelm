[package]
name = "unihelm-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
unihelm-core = { workspace = true }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["alloc"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# flock(2) for the schema lock. Already a workspace dependency and already in
# this crate's link graph via libsqlite3-sys, so nothing new arrives.
libc = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "getrandom"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
