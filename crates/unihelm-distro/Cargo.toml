[package]
name = "unihelm-distro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
unihelm-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Pinned to the digest 0.10 line so it shares traits with sha2; sha1 0.11 moved
# to digest 0.11 and the two cannot be mixed.
sha1 = "0.10"
base64 = "0.23.1"
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
# For the `verify-pins` example, which checks the pinned fingerprints against
# what the vendors are serving today.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
