[package]
name = "ferrum-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ferrum-config = { workspace = true }
ferrum-core = { workspace = true }
ferrum-db = { workspace = true }
ferrum-distro = { workspace = true }
ferrum-metrics = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }
zstd = { workspace = true }
# `aws_lc_rs` is the backend instant-acme also uses, so the two share one
# crypto provider rather than pulling in both ring and aws-lc-rs.
rcgen = { version = "0.14", default-features = false, features = ["pem", "crypto", "aws_lc_rs"] }
# Fetching repository signing keys over HTTPS. rustls rather than OpenSSL, so a
# release build needs no system TLS library and `cargo deny` can keep banning
# openssl-sys.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
# ACME / Let's Encrypt. 0.8.5 is a hard floor: earlier versions treat a
# challenge's `token` as a required field, and Let's Encrypt's dns-persist-01
# challenge has none — so a single such challenge in an authorization fails
# deserialization and kills the whole order, even for an HTTP-01-only client.
instant-acme = { version = "0.8.5", features = ["rcgen", "time", "x509-parser"] }
time = { workspace = true }
x509-parser = "0.18.1"
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Used only to simulate an account disappearing under a live auth context.
sqlx = { workspace = true }
tempfile = "3.27.0"
