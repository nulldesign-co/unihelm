[package]
name = "ferrum-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ferrum-config = { workspace = true }
ferrum-core = { workspace = true }
ferrum-db = { workspace = true }
ferrum-distro = { workspace = true }
ferrum-metrics = { workspace = true }
async-trait = { workspace = true }
# Verifying the Adminer download against its pinned sha256 (spec §11.4).
hex = { workspace = true }
# HMAC-SHA256 signatures over webhook deliveries (spec §14 Phase 6).
hmac = { workspace = true }
sha2 = { workspace = true }
# Show-once database passwords (spec §11.4): thread_rng is a CSPRNG.
rand = { workspace = true }
base64 = { workspace = true }
# Verifying minisign signatures on plugin manifests in-process.
blake2 = { workspace = true }
ed25519-dalek = { workspace = true }
flate2 = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
# The plugin sidecar contract reuses the panel IPC framing rather than
# inventing a second protocol (spec §6 plugin note).
ferrum-ipc = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }
zstd = { workspace = true }
# `aws_lc_rs` is the backend instant-acme also uses, so the two share one
# crypto provider rather than pulling in both ring and aws-lc-rs.
rcgen = { version = "0.14", default-features = false, features = ["pem", "crypto", "aws_lc_rs"] }
# Fetching repository signing keys over HTTPS, and the Cloudflare API client in
# `dns.rs`. Pinned in [workspace.dependencies] with rustls rather than OpenSSL.
reqwest = { workspace = true }
# `dns.check`, and DNS-01 propagation polling against a zone's authoritative
# nameservers (spec §11.13).
hickory-resolver = { workspace = true }
# ACME / Let's Encrypt. 0.8.5 is a hard floor: earlier versions treat a
# challenge's `token` as a required field, and Let's Encrypt's dns-persist-01
# challenge has none — so a single such challenge in an authorization fails
# deserialization and kills the whole order, even for an HTTP-01-only client.
instant-acme = { version = "0.8.5", features = ["rcgen", "time", "x509-parser"] }
time = { workspace = true }
# Salt generation for the sha512-crypt hashes below.
# sha512-crypt hashes for `usermod --password`: /etc/shadow must hold a hash
# crypt(3) understands, and the panel's argon2 hashes are not that (sftp.rs).
sha-crypt = { workspace = true }
x509-parser = "0.18.1"
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Used only to simulate an account disappearing under a live auth context.
sqlx = { workspace = true }
tempfile = "3.27.0"
