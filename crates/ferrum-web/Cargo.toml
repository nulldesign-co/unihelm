[package]
name = "ferrum-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ferrum-web"
path = "src/main.rs"

[dependencies]
ferrum-core = { workspace = true }
ferrum-db = { workspace = true }
ferrum-ipc = { workspace = true }
ferrum-metrics = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
rust-embed = "8.12.0"
mime_guess = "2.0.5"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace", "compression-gzip", "limit", "set-header"] }
async-stream = "0.3.6"
