# /run is tmpfs, so everything under it is gone after a reboot.
#
# RuntimeDirectory=unihelm on unihelm-agentd.service recreates /run/unihelm, but
# only that — not the fpm subdirectory the per-site pools listen in. php-fpm does
# not create the parent of its listen socket, and nothing orders it after the
# agent, so on the first reboot after a site exists every PHP site returns 502
# while the panel and `unihelm doctor` both look healthy.
#
# systemd-tmpfiles-setup.service is ordered before every ordinary service, which
# is why the directory is declared here rather than with more RuntimeDirectory=.
d /run/unihelm 0755 root root -
d /run/unihelm/fpm 0755 root root -
